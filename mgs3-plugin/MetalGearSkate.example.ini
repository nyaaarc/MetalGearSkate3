; Copy beside MetalGearSkate.asi (the game's plugins folder) as MetalGearSkate.ini.
[skate]
; The `assets` folder inside the Skate 3 converter's output.
skate_data=C:\Users\you\Games\Skate3-data\assets
; How MGS3's facing converts to the skate engine's: engine = sign * mgs + offset.
; If the board heads off at a fixed angle from where Snake faced, change the offset (90, 180, -90).
; If steering left turns right, set heading_sign=-1.
heading_sign=1
heading_offset_deg=0
; Pre-exported stage collision: python -I tools/geom.py "<MGS3>\assets\geom\us" --bin <this folder>
collision=C:\Users\you\Games\Skate3-data\mgs3-collision

[render]
; Board drawing camera, tuned in game (docs/TESTING.md, "Rendering"). Vertical field of view.
fov_deg=50
near_mm=100
far_mm=300000
; Width/height of the 3D picture; 0 = the window's.
aspect=0
; 1 = left-handed view (mirrors the picture) if the board shows up mirrored.
flip_z=0
; 1 = test against the game's depth buffer if one is bound at Present (else the board draws over scenery).
depth_game=0
; 1 = draw a marker and axes at Snake's position.
debug=0
