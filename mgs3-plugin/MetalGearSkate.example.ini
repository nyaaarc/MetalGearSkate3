; Copy beside MetalGearSkate.asi (the game's plugins folder) as MetalGearSkate.ini.
[skate]
; The `assets` folder inside the Skate 3 converter's output.
skate_data=C:\Users\you\Games\Skate3-data\assets
; How MGS3's facing converts to the skate engine's: engine = sign * mgs + offset.
; If the board heads off at a fixed angle from where Snake faced, change the offset (90, 180, -90).
; If steering left turns right, set heading_sign=-1.
heading_sign=1
heading_offset_deg=0
; Only for an old skate_ffi.dll without the .geom reader: pre-exported stage collision
; (python -I tools/geom.py "<MGS3>\assets\geom\us" --bin <folder>)
; collision=C:\Users\you\Games\Skate3-data\mgs3-collision
; Guards ignore Snake while skating (equips the stealth camouflage). Off by default: the camouflage
; pass draws Snake as an unposed see-through ghost off the board. 1 = on.
stealth_while_skating=0
; Mirror the skater pose across his own centre plane (flips stance). Leave 0 unless the pose looks mirrored.
mirror_x=0

[render]
; Camera while skating: drive (default: the game's own camera follows the Skate 3 chase camera),
; skate (re-project the game's draws), game or object. drive_zoom: 0 = the engine's field of view.
; camera=drive
; drive_zoom=0
; Board drawing camera, tuned in game (docs/TESTING.md, "Rendering"). Vertical field of view.
fov_deg=50
near_mm=100
far_mm=300000
; Width/height of the 3D picture; 0 = the window's.
aspect=0
; 1 = left-handed view (mirrors the picture) if the board shows up mirrored.
flip_z=0
; 1 = hide the board behind scenery using a copy of the scene's depth buffer (0 = draw over everything).
depth_game=1
; How much nearer (relative) the scene must be to hide the board.
depth_bias=0.002
; 1 = log the scene's depth under the deck and the deck's own, once a second.
depth_debug=0
; 1 = draw the board with Skate 3's textures (from the converted skater.glb), 0 = flat colours.
textures=1
; 1 = draw a marker and axes at Snake's position.
debug=0
