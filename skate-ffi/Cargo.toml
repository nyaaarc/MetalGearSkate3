[package]
name = "skate-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "C interface to the Skate 3 Rust engine, for hosting it inside MGS3"

[lib]
crate-type = ["cdylib"]

[dependencies]
skate-host = { path = "../mashup/skate/crates/skate-host" }
skate-core = { path = "../mashup/skate/crates/skate-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Skate 3's audio runtime (vendored from SK8-ENGINE/skate-3-rust-engine b3c96793, GPL-3.0-only).
skate-audio = { path = "../mashup/skate/crates/skate-audio" }
# Same build as skate-host's (math types and logging the ported audio host uses).
bevy = { version = "0.19", default-features = false, features = ["std", "multi_threaded", "bevy_log"] }
glam = "0.32"
miniz_oxide = "0.9"  # PNG inflate for the board textures (already in the tree)

[profile.release]
lto = "thin"

# Standalone: not part of the engine's workspace.
[workspace]
